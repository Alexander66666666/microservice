spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/orders_db
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: your-super-secure-jwt-secret-key-minimum-32-chars-here
  expiration: 86400000

logging:
  level:
    com.example.orderservice: DEBUG
    org.springdoc: DEBUG
    org.springframework.web: TRACE
    org.springframework.security: DEBUG
